name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    name: Build Release APK

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Show Java version
        run: |
          java -version
          javac -version

      - name: Download Gradle 8.10.2
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q \
            gradle-8.10.2-bin.zip \
            -d "$HOME"

          chmod +x \
            "$HOME/gradle-8.10.2/bin/gradle"

      - name: Check Gradle
        run: |
          "$HOME/gradle-8.10.2/bin/gradle" --version

      - name: Build release APK
        run: |
          set -e

          "$HOME/gradle-8.10.2/bin/gradle" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleRelease

      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BibleVerseVideoGenerator-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
