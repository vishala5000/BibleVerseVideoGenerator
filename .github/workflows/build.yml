name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Show Java version
        run: |
          java -version
          javac -version

      - name: Download Gradle 8.10.2
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q \
            gradle-8.10.2-bin.zip \
            -d "$HOME"

          chmod +x \
            "$HOME/gradle-8.10.2/bin/gradle"

      - name: Check Gradle
        run: |
          set -e

          "$HOME/gradle-8.10.2/bin/gradle" --version

      - name: Clean project
        run: |
          set -e

          "$HOME/gradle-8.10.2/bin/gradle" \
            --no-daemon \
            clean

      - name: Build release APK
        run: |
          set -e

          "$HOME/gradle-8.10.2/bin/gradle" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleRelease

      - name: Show build output
        if: always()
        run: |
          echo "============================================================"
          echo "APK FILES"
          echo "============================================================"

          find . -type f -name "*.apk" -print || true

          echo ""
          echo "============================================================"
          echo "APP BUILD DIRECTORY"
          echo "============================================================"

          if [ -d "app/build" ]; then
            find app/build -type f | sort || true
          else
            echo "app/build directory does not exist."
          fi

      - name: Prepare APK
        run: |
          set -e

          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."

            echo ""
            echo "All APK files:"
            find . -type f -name "*.apk" -print || true

            echo ""
            echo "Build outputs:"
            if [ -d "app/build/outputs" ]; then
              find app/build/outputs -type f -print || true
            else
              echo "app/build/outputs does not exist."
            fi

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            release/BibleVerseVideoGenerator.apk

          echo ""
          echo "Final APK:"
          ls -lh release/BibleVerseVideoGenerator.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BibleVerseVideoGenerator-release
          path: release/BibleVerseVideoGenerator.apk
          if-no-files-found: error
