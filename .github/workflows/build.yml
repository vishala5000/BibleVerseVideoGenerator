name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check Java
        run: |
          java -version

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          mkdir -p "$HOME/.gradle/wrapper/dists"
          find "$HOME/.gradle/wrapper/dists" -type f -name gradle -exec chmod +x {} \; 2>/dev/null || true
          find "$HOME/.gradle/wrapper/dists" -type f -path "*/gradle-8.10.2/bin/gradle" -exec chmod +x {} \; 2>/dev/null || true
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BibleVerseVideoGenerator-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
