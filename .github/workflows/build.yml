name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check Java
        run: |
          java -version

      - name: Download Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$HOME"
          chmod +x "$HOME/gradle-8.10.2/bin/gradle"

      - name: Build release APK
        run: |
          chmod +x "$HOME/gradle-8.10.2/bin/gradle"
          "$HOME/gradle-8.10.2/bin/gradle" \
            --no-daemon \
            --stacktrace \
            assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BibleVerseVideoGenerator-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
