name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    name: Build Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 21
      # ============================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # ============================================================
      # 3. SHOW JAVA
      # ============================================================
      - name: Show Java version
        run: |
          java -version
          javac -version


      # ============================================================
      # 4. DOWNLOAD GRADLE
      # ============================================================
      - name: Download Gradle 8.10.2
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q \
            gradle-8.10.2-bin.zip \
            -d "$HOME"

          chmod +x \
            "$HOME/gradle-8.10.2/bin/gradle"


      # ============================================================
      # 5. CHECK GRADLE
      # ============================================================
      - name: Check Gradle
        run: |
          "$HOME/gradle-8.10.2/bin/gradle" --version


      # ============================================================
      # 6. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        run: |
          set -e

          "$HOME/gradle-8.10.2/bin/gradle" \
            --no-daemon \
            clean


      # ============================================================
      # 7. BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        run: |
          set -e

          "$HOME/gradle-8.10.2/bin/gradle" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleRelease


      # ============================================================
      # 8. FIND APK
      # ============================================================
      - name: Find generated APK
        run: |
          set -e

          echo "=========================================="
          echo "Searching for generated APK files..."
          echo "=========================================="

          find . -type f -name "*.apk" -print

          echo "=========================================="
          echo "Build directory:"
          echo "=========================================="

          if [ -d "app/build" ]; then
            find app/build -maxdepth 6 -type f | sort
          else
            echo "ERROR: app/build directory does not exist."
            exit 1
          fi


      # ============================================================
      # 9. PREPARE APK
      # ============================================================
      - name: Prepare APK artifact
        run: |
          set -e

          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo ""
            echo "All APK files:"
            find . -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/BibleVerseVideoGenerator.apk

          echo ""
          echo "Final APK:"
          ls -lh release/BibleVerseVideoGenerator.apk


      # ============================================================
      # 10. UPLOAD APK
      # ============================================================
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BibleVerseVideoGenerator-release
          path: release/BibleVerseVideoGenerator.apk
          if-no-files-found: error

### Also make sure `app/build.gradle` contains this

The previous error you had about Java/Kotlin compatibility requires **both targets to be 21**:

```gradle
compileOptions {
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
}

kotlinOptions {
    jvmTarget = '21'
}
````

So your `app/build.gradle` should have:

```gradle
android {
    namespace 'com.bibledailyshine.generator'

    compileSdk 35

    defaultConfig {
        applicationId 'com.bibledailyshine.generator'
        minSdk 24
        targetSdk 35

        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }

        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}
